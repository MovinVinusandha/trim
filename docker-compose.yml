services:
  mysql:
    image: mysql:8.0
    container_name: url_shortener_db
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    command: redis-server --appendonly yes
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: url_shortener_gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - web_network
      - backend_network
      - db_network
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: url_shortener_auth
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/url_shortener_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8081:8081"
    networks:
      - db_network
      - backend_network
    depends_on:
      mysql:
        condition: service_healthy

  core-service:
    build:
      context: ./backend
      dockerfile: core-service/Dockerfile
    container_name: url_shortener_core
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/url_shortener_core?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - ANALYTICS_SERVICE_INTERNAL_URL=http://analytics-service:8083
    ports:
      - "8082:8082"
    networks:
      - db_network
      - backend_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    container_name: url_shortener_analytics
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/url_shortener_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8083:8083"
    networks:
      - db_network
      - backend_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect-service:
    build:
      context: ./backend
      dockerfile: redirect-service/Dockerfile
    container_name: url_shortener_redirect
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/url_shortener_core?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8084:8084"
    networks:
      - db_network
      - backend_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: url_shortener_frontend
    env_file:
      - .env
    ports:
      - "80:8080"
    networks:
      - web_network
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  redis_data:

networks:
  db_network:
    driver: bridge
  backend_network:
    driver: bridge
  web_network:
    driver: bridge
